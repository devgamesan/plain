name: Python CI

on:
  push:
    branches:
      - main
      - develop
      - feat/windows
  pull_request:
    branches:
      - main
      - develop
      - feat/windows

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python with uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: "3.12"

      - name: Check lockfile
        run: uv lock --check

      - name: Install audit dependencies
        run: uv sync --locked --dev --no-install-project

      - name: Export production dependencies
        run: >
          uv export --frozen
          --no-dev
          --no-emit-project
          --format requirements.txt
          --output-file "$RUNNER_TEMP/zivo-production-requirements.txt"

      - name: Audit production dependencies
        run: >
          uv run --locked --no-sync pip-audit
          --no-deps
          --disable-pip
          --requirement "$RUNNER_TEMP/zivo-production-requirements.txt"

  lint-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: "3.12"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ripgrep

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Get-Command rg -ErrorAction SilentlyContinue) {
            rg --version
            exit 0
          }

          $version = "15.2.0"
          $archive = Join-Path $env:RUNNER_TEMP "ripgrep-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ripgrep-$version"
          $url = "https://github.com/BurntSushi/ripgrep/releases/download/$version/ripgrep-$version-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force

          $binary = Get-ChildItem -Path $extract -Recurse -Filter rg.exe | Select-Object -First 1
          if ($null -eq $binary) {
            throw "ripgrep executable was not found in the downloaded archive"
          }
          $binary.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $binary.FullName --version

      - name: Install dependencies
        run: uv sync --dev

      - name: Prepare temp directory
        run: >
          uv run python -c "from pathlib import Path; import os;
          Path(os.environ['RUNNER_TEMP'], 'zivo-tmp').mkdir(parents=True, exist_ok=True)"

      - name: Lint
        run: uv run ruff check .

      - name: Test (Linux/macOS full suite)
        if: runner.os != 'Windows'
        env:
          TMPDIR: ${{ runner.temp }}/zivo-tmp
          TMP: ${{ runner.temp }}/zivo-tmp
          TEMP: ${{ runner.temp }}/zivo-tmp
        run: uv run pytest

      - name: Test (Windows supported regression scope)
        if: runner.os == 'Windows'
        env:
          TMPDIR: ${{ runner.temp }}/zivo-tmp
          TMP: ${{ runner.temp }}/zivo-tmp
          TEMP: ${{ runner.temp }}/zivo-tmp
        # The full suite was evaluated for Issue #1160. It currently has
        # 24 native-Windows failures (POSIX path/newline assumptions,
        # chmod/chown semantics, and platform-specific UI timing). Keep the
        # established file-operation/search/config regression scope explicit
        # until those tests are ported.
        run: >
          uv run pytest
          tests/test_adapters_file_operations.py
          tests/test_services_clipboard_operations.py
          tests/test_services_file_mutations.py
          tests/test_services_archive_extract.py
          tests/test_services_zip_compress.py
          tests/test_services_file_search.py
          tests/test_services_grep_search.py
          tests/test_services_text_replace.py
          tests/test_services_config.py

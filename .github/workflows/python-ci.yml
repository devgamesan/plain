name: Python CI

on:
  push:
    branches:
      - main
      - develop
      - feat/windows
  pull_request:
    branches:
      - main
      - develop
      - feat/windows

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python with uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: "3.12"

      - name: Check lockfile
        run: uv lock --check

      - name: Install audit dependencies
        run: uv sync --locked --dev --no-install-project

      - name: Export production dependencies
        run: >
          uv export --frozen
          --no-dev
          --no-emit-project
          --format requirements.txt
          --output-file "$RUNNER_TEMP/zivo-production-requirements.txt"

      - name: Audit production dependencies
        run: >
          uv run --locked --no-sync pip-audit
          --no-deps
          --disable-pip
          --requirement "$RUNNER_TEMP/zivo-production-requirements.txt"

  lint-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: "3.12"

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ripgrep

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y

      - name: Install dependencies
        run: uv sync --dev

      - name: Prepare temp directory
        run: >
          uv run python -c "from pathlib import Path; import os;
          Path(os.environ['RUNNER_TEMP'], 'zivo-tmp').mkdir(parents=True, exist_ok=True)"

      - name: Lint
        run: uv run ruff check .

      - name: Test (all platforms)
        env:
          TMPDIR: ${{ runner.temp }}/zivo-tmp
          TMP: ${{ runner.temp }}/zivo-tmp
          TEMP: ${{ runner.temp }}/zivo-tmp
        # Keep the Windows job on the full suite so regressions outside the
        # historical file-operation subset are caught before release.
        run: uv run pytest
